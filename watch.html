<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观看 · 汐站 TideVideo</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" aria-label="汐站首页">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">汐站<em>TideVideo</em></span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a class="nav-item" href="index.html">首页</a>
      <a class="nav-item" href="index.html#feed">推荐</a>
    </nav>
    <form class="search" role="search" onsubmit="return false">
      <label class="sr-only" for="q">搜索视频</label>
      <input id="q" type="search" placeholder="搜索视频、UP 主（本地演示数据）" autocomplete="off">
      <button type="submit" aria-label="搜索">搜索</button>
    </form>
    <div class="topbar-actions">
      <button class="ghost-btn" type="button" title="演示占位，无上传功能">投稿</button>
      <div class="avatar" aria-hidden="true">汐</div>
    </div>
  </div>
</header>

<main id="main" class="watch-layout">
  <div class="watch-main">
    <div class="player" id="player">
      <!-- 真实播放：本地 media/demo.mp4（CC0 公共领域片段）。缺失或解码失败时
           自动退回 Canvas 模拟画面，页面功能不受影响。 -->
      <video id="video" playsinline preload="auto" muted loop>
        <source src="media/demo.mp4" type="video/mp4">
      </video>
      <canvas id="stage" width="1280" height="720" aria-label="播放区（模拟画面回退）" hidden></canvas>

      <div class="danmaku-layer" id="danmakuLayer" aria-hidden="true"></div>

      <div class="player-badge" id="playerBadge">演示片段</div>

      <div class="player-center">
        <button class="big-play" id="bigPlay" type="button" aria-label="播放">
          <span aria-hidden="true">▶</span>
        </button>
      </div>

      <div class="player-controls" id="controls">
        <button class="icon-btn" id="playBtn" type="button" aria-label="播放">▶</button>
        <span class="time" id="timeNow">0:00</span>
        <div class="progress" id="progress" role="slider" tabindex="0"
             aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-buffer" id="progressBuffer"></div>
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time" id="timeTotal">0:00</span>
        <button class="icon-btn" id="muteBtn" type="button" aria-label="静音">🔊</button>
        <button class="icon-btn text" id="rateBtn" type="button" aria-label="播放速度">1.0×</button>
        <button class="icon-btn" id="dmToggle" type="button" aria-label="弹幕开关" aria-pressed="true">弹</button>
        <button class="icon-btn" id="fsBtn" type="button" aria-label="全屏">⛶</button>
      </div>
    </div>

    <div class="danmaku-composer">
      <label class="sr-only" for="dmInput">发送弹幕</label>
      <input id="dmInput" type="text" maxlength="60" placeholder="发一条弹幕…（仅保存在本机 localStorage）">
      <input id="dmColor" type="color" value="#ffffff" aria-label="弹幕颜色">
      <button id="dmSend" type="button">发送</button>
      <label class="dm-only"><input type="checkbox" id="dmOnly" checked> 只看当前视频</label>
    </div>

    <h1 class="video-title" id="videoTitle">加载中…</h1>
    <div class="video-meta" id="videoMeta"></div>

    <div class="up-card" id="upCard"></div>

    <section class="description" id="description"></section>

    <section class="comments">
      <h2 class="section-title">评论 <small id="commentCount"></small></h2>
      <div class="comment-form">
        <input id="commentInput" type="text" maxlength="200" placeholder="友善发言（仅保存在本机）">
        <button id="commentSend" type="button">发送</button>
      </div>
      <ul class="comment-list" id="commentList"></ul>
    </section>
  </div>

  <aside class="watch-side">
    <h2 class="section-title">接着看</h2>
    <div class="side-list" id="sideList"></div>
  </aside>
</main>

<footer class="footer">
  <p>汐站 TideVideo · 纯前端演示。播放片段为 <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/video" rel="noopener">MDN</a> 提供的
  <strong>CC0（公共领域）</strong>样例 <code>flower.mp4</code>，仅作本地演示；弹幕与评论为本地模拟数据，不请求任何外部服务。</p>
</footer>

<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/danmaku.js"></script>
<script src="assets/watch.js"></script>
</body>
</html>
