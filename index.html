<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汐站 TideVideo · 首页</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip" href="#main">跳到主内容</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" aria-label="汐站首页">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">汐站<em>TideVideo</em></span>
    </a>

    <nav class="nav" aria-label="主导航">
      <a class="nav-item is-active" href="index.html">首页</a>
      <a class="nav-item" href="#feed">推荐</a>
      <a class="nav-item" href="#feed">热门</a>
      <a class="nav-item" href="#feed">频道</a>
    </nav>

    <form class="search" role="search" onsubmit="return false">
      <label class="sr-only" for="q">搜索视频</label>
      <input id="q" type="search" placeholder="搜索视频、UP 主（本地演示数据）" autocomplete="off">
      <button type="submit" aria-label="搜索">搜索</button>
    </form>

    <div class="topbar-actions">
      <button class="ghost-btn" id="importBtn" type="button" title="从本机选择视频，只在你浏览器里播放，不会上传">导入视频</button>
      <input id="filePicker" type="file" accept="video/*" multiple hidden>
      <div class="avatar" aria-hidden="true">汐</div>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" aria-roledescription="轮播" aria-label="精选内容">
    <div class="hero-track" id="heroTrack"></div>
    <div class="hero-dots" id="heroDots" role="tablist" aria-label="切换精选"></div>
    <button class="hero-arrow prev" id="heroPrev" type="button" aria-label="上一张">‹</button>
    <button class="hero-arrow next" id="heroNext" type="button" aria-label="下一张">›</button>
  </section>

  <section class="chips" id="chips" aria-label="分区筛选"></section>

  <section class="feed" id="feed">
    <h2 class="section-title">推荐 <small id="feedCount"></small></h2>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>没有匹配的内容，换个关键词试试。</p>
  </section>

  <section class="feed" id="importedSection" hidden>
    <h2 class="section-title">我的导入 <small id="importedCount"></small>
      <button class="ghost-btn tiny" id="clearImports" type="button">清空</button>
    </h2>
    <div class="grid" id="importedGrid"></div>
    <p class="empty">这些文件只存在于当前标签页的内存里：不经过网络、不上传、刷新即消失。</p>
  </section>
</main>

<dialog id="playerDialog" class="player-dialog" aria-label="本机视频播放">
  <div class="dialog-head">
    <strong id="dlgTitle">本机视频</strong>
    <button class="icon-btn" id="dlgClose" type="button" aria-label="关闭">✕</button>
  </div>
  <video id="dlgVideo" controls playsinline></video>
  <p class="dlg-meta" id="dlgMeta"></p>
</dialog>

<div class="drop-hint" id="dropHint" hidden>松手即导入（仅本机播放，不上传）</div>

<footer class="footer">
  <p>汐站 TideVideo · 纯前端演示项目。所有视频、UP 主、评论均为本地虚构数据，不使用任何第三方平台的内容、接口或素材。</p>
</footer>

<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/app.js"></script>
<script src="assets/import.js"></script>
</body>
</html>
